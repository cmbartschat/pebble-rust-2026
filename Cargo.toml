[workspace]
members = ["pebble-sdk", "pebble-sdk-macros"]
# cargo-pebble does not handle workspaces, so the examples must not be in the workspace
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[profile.release]
panic = "abort"
debug = true
opt-level = 2

[profile.dev]
panic = "abort"

[workspace.lints.clippy]
missing-const-for-fn = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(platform, values("aplite", "basalt", "chalk", "diorite", "emery", "flint", "gabbro"))',
] }
missing-docs = "deny"
